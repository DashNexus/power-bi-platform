name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to the same branch supersedes the run in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API — lint and unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    # The unit suite mocks the database, so no service container is needed here.
    # Real-database coverage is the `api-integration` job below.
    env:
      APP_DATABASE_URL: postgresql+asyncpg://u:p@localhost/db
      WAREHOUSE_DATABASE_URL: postgresql+asyncpg://u:p@localhost/db
      NEXTAUTH_SECRET: ci-secret
      TOTP_ENCRYPTION_KEY: ci-key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: api/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint changed files
        run: ruff check app/ tests/ alembic/

      - name: Unit tests
        run: python -m pytest tests/ -q

  api-integration:
    name: API — migration against SQL Server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      # The real engine, because the two failures this catches are both
      # server-side: a VARCHAR with no length, and a second ON DELETE CASCADE
      # path between two tables (error 1785). Neither shows up on PostgreSQL.
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: CiRunner_Passw0rd!
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P CiRunner_Passw0rd! -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 30s
    steps:
      - uses: actions/checkout@v4

      - name: Install the ODBC driver
        run: |
          curl -fsSL https://packages.microsoft.com/keys/microsoft.asc \
            | sudo gpg --dearmor -o /usr/share/keyrings/microsoft-prod.gpg
          echo "deb [signed-by=/usr/share/keyrings/microsoft-prod.gpg] \
          https://packages.microsoft.com/ubuntu/22.04/prod jammy main" \
            | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18 unixodbc-dev mssql-tools18

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: api/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Create the database
        run: |
          /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'CiRunner_Passw0rd!' -C -b \
            -Q "IF DB_ID('biplatform_app') IS NULL CREATE DATABASE biplatform_app;"

      - name: Migrate, then migrate again
        # The second run proves the seed is idempotent — every insert in it is
        # guarded, and a regression there breaks redeploys, not first installs.
        env:
          APP_DATABASE_URL: mssql+aioodbc://sa:CiRunner_Passw0rd!@localhost:1433/biplatform_app?driver=ODBC+Driver+18+for+SQL+Server&TrustServerCertificate=yes
          WAREHOUSE_DATABASE_URL: mssql+aioodbc://sa:CiRunner_Passw0rd!@localhost:1433/biplatform_app?driver=ODBC+Driver+18+for+SQL+Server&TrustServerCertificate=yes
          NEXTAUTH_SECRET: ci-secret
          TOTP_ENCRYPTION_KEY: ci-key
        run: |
          alembic upgrade head
          alembic upgrade head

      - name: Verify the seed
        run: |
          /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'CiRunner_Passw0rd!' -C -b \
            -d biplatform_app -Q "
              SET NOCOUNT ON;
              DECLARE @roles INT = (SELECT COUNT(*) FROM roles);
              DECLARE @perms INT = (SELECT COUNT(*) FROM permissions);
              DECLARE @users INT = (SELECT COUNT(*) FROM users);
              IF @roles <> 5 OR @perms = 0 OR @users <> 1
                THROW 50000, 'Seed did not produce the expected rows', 1;
              PRINT 'seed ok';
            "

  application:
    name: Frontend — lint, typecheck, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: application
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: application/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run build

  images:
    name: Container images build
    runs-on: ubuntu-latest
    # Only worth the minutes once the code itself is known good.
    needs: [api, application]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the API image
        uses: docker/build-push-action@v6
        with:
          context: ./api
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build the frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./application
          push: false
          build-args: NEXT_PUBLIC_API_URL=http://localhost:8000
          cache-from: type=gha
          cache-to: type=gha,mode=max
