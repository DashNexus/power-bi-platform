[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "power-bi-platform-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    # Azure SQL / SQL Server, the default backend. aioodbc is the async driver
    # SQLAlchemy uses for `mssql+aioodbc://`; both need an ODBC driver on the
    # host (see deploy/README.md).
    "aioodbc>=0.5.0",
    "pyodbc>=5.1.0",
    # PostgreSQL is also supported end to end — see app/sql_compat.py.
    "asyncpg>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    # Optional at runtime: without a reachable Redis the poller lock and the
    # notification rate limiter degrade to single-node behaviour.
    "redis>=5.0.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.1.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "cryptography>=42.0.0",
    "structlog>=24.1.0",
    "fsspec>=2024.2.0",
    "adlfs>=2024.2.0",
    "pyotp>=2.9.0",
    "qrcode[pil]>=7.4.0",
    "aiofiles>=23.2.1",
    "tenacity>=8.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]
# Object storage backends other than Azure Blob (adlfs ships by default).
# Both are imported lazily in app/storage.py, so an unused one costs nothing.
storage-s3 = ["s3fs>=2024.2.0"]
storage-gcs = ["gcsfs>=2024.2.0"]
# SFTP export delivery — imported lazily, and reports its own install hint.
delivery-sftp = ["paramiko>=3.4.0"]
# Warehouse connection drivers for the *data dictionary* — the warehouse a
# dictionary describes need not be the one the app runs on. Install what you
# need: pip install ".[warehouse-snowflake]" or ".[warehouse-all]".
warehouse-sqlserver = ["pyodbc>=5.1.0"]
warehouse-postgres = ["psycopg2-binary>=2.9.0"]
warehouse-snowflake = ["snowflake-sqlalchemy>=1.6.0"]
warehouse-mysql = ["pymysql>=1.1.0"]
warehouse-bigquery = ["sqlalchemy-bigquery>=1.11.0", "google-cloud-bigquery>=3.0.0"]
warehouse-databricks = ["databricks-sql-connector>=3.0.0"]
warehouse-all = [
    "pyodbc>=5.1.0",
    "psycopg2-binary>=2.9.0",
    "snowflake-sqlalchemy>=1.6.0",
    "pymysql>=1.1.0",
    "sqlalchemy-bigquery>=1.11.0",
    "google-cloud-bigquery>=3.0.0",
    "databricks-sql-connector>=3.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "ANN", "D"]
ignore = ["D100", "D104", "D107"]

[tool.ruff.lint.per-file-ignores]
# Tests describe intent through their names (test_<thing>_<condition>_<outcome>)
# and Arrange/Act/Assert structure, so class/method docstrings are not required.
"tests/**" = ["D101", "D102", "D103", "D106"]
# A migration is a data script, not an API: the module docstring carries the
# explanation and per-statement docstrings would be noise.
"alembic/versions/**" = ["D103", "E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires a live database",
    "slow: tests that take more than a few seconds",
]
addopts = "-m 'not integration'"
